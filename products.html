<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>الأجهزة - Control Point Store</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
}

header{
    background:#0b3d91;
    color:white;
    text-align:center;
    padding:20px;
}

h1{
    margin:10px;
}

.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    padding:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 2px 8px #ccc;
}

.card img{
    width:180px;
    height:150px;
    object-fit:contain;
}

.btn{
    display:inline-block;
    background:#25D366;
    color:white;
    padding:12px 20px;
    border-radius:10px;
    text-decoration:none;
}

</style>

</head>

<body>

<header>
<h1>أجهزة المساحة</h1>
<p>Control Point Store</p>
</header>


<section class="products">

<div class="card">
<img src="device1.png">
<h2>Total Station</h2>
<p>أجهزة توتال استيشن بأفضل الأسعار</p>
<a class="btn" href="https://wa.me/201016690951">
اطلب الآن
</a>
</div>


<div class="card">
<img src="device2.png">
<h2>GPS Survey</h2>
<p>أجهزة GPS مساحية عالية الدقة</p>
<a class="btn" href="https://wa.me/201016690951">
اطلب الآن
</a>
</div>


<div class="card">
<img src="device3.png">
<h2>ميزان ليزر</h2>
<p>أدوات وإكسسوارات المساحة</p>
<a class="btn" href="https://wa.me/201016690951">
اطلب الآن
</a>
</div>


</section>

</body>
</html>
